<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>네오 아보카도 운영</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../scheme.js"></script>
  </head>
  <body class="admin-page">
    <header class="top">
      <h1>커뮤니티 운영</h1>
      <a href="../">커뮤니티로</a>
      <!-- adm/admin.head.php's developer_guide link. -->
      <a
        href="https://github.com/naru-pub/neo-avocado"
        target="_blank"
        rel="noopener"
        >개발 안내</a
      >
      <select id="schemeChoice" class="scheme-choice" aria-label="화면 모드">
        <option value="">시스템</option>
        <option value="light">라이트</option>
        <option value="dark">다크</option>
      </select>
    </header>
    <p id="adminStatus" role="status"></p>
    <section id="adminWelcome">
      <p>사이트 소유자의 나루 계정으로 로그인해 운영합니다.</p>
      <p>
        처음 설정할 때는 <a href="https://naru.pub/deploys">나루 제어판</a>에서
        README에 있는 컬렉션과 권한을 먼저 만드세요.
      </p>
      <button id="adminSignIn" type="button">운영자 로그인</button>
    </section>
    <main id="adminWorkspace" hidden>
      <!-- adm/admin.head.php's side menu, in its groups. -->
      <nav id="adminNav" aria-label="관리 메뉴"></nav>
      <div id="adminPane">
        <button id="adminSignOut" type="button">운영자 로그아웃</button>
        <p id="adminHelp"></p>
        <label id="holdingsSearchLabel" hidden
          >캐릭터·타이틀 검색<input id="holdingsSearch" type="search" /><button
            id="holdingsFind"
            type="button"
          >
            검색
          </button></label
        >
        <!-- adm/character_list.php's search, filters, counts and 선택승인. -->
        <form id="reviewTools" hidden>
          <p id="reviewStates"></p>
          <select id="reviewSide" aria-label="소속"></select>
          <select id="reviewClass" aria-label="종족"></select>
          <select id="reviewField" aria-label="검색 대상">
            <option value="name">캐릭터 이름</option>
            <option value="nick">오너 닉네임</option>
          </select>
          <input id="reviewSearch" type="search" aria-label="검색어" />
          <button type="submit">검색</button>
          <button id="reviewApprove" type="button">선택 승인</button>
          <button id="reviewDelete" type="button">선택삭제</button>
          <button id="reviewRemove" type="button">선택제거</button>
        </form>
        <label id="memberSearchLabel" hidden
          ><select id="memberField" aria-label="검색 대상">
            <option value="nick">닉네임·회원 번호</option>
            <option value="level">권한 (등급)</option>
            <option value="recommender">추천인</option></select
          ><input id="memberSearch" type="search" /><button
            id="memberFind"
            type="button"
          >
            검색
          </button></label
        >
        <!-- member_list_update.php's 선택수정 (권한), 선택탈퇴 and 선택삭제. -->
        <p id="memberTools" hidden>
          <select id="memberLevel" aria-label="바꿀 등급">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
          <button id="membersLevel" type="button">선택수정 (등급)</button>
          <button id="membersLeave" type="button">선택탈퇴</button>
          <button id="membersDelete" type="button">선택삭제</button>
        </p>
        <!-- adm/board_list.php's 선택수정 and 선택삭제 (board_list_update.php). -->
        <p id="boardTools" hidden>
          <button id="boardsSave" type="button">선택수정</button>
          <button id="boardsRemove" type="button">선택삭제</button>
        </p>
        <!-- adm/item_list.php's 아이템 분류 (cate). -->
        <label id="itemCategoryLabel" hidden
          >아이템 분류
          <select id="itemCategory">
            <option value="">전체</option>
            <option value="general">일반</option>
            <option value="personal">개인</option>
            <option value="attendance">출석</option>
          </select>
          <!-- item_list.php's 아이템 기능 (it_type) and 이름·설명 search. -->
          <select id="itemEffect" aria-label="아이템 기능">
            <option value="">기능 전체</option>
            <option value="none">사용 효과 없음</option>
            <option value="restore">능력치 회복</option>
            <option value="draw">뽑기권</option>
            <option value="create">개인 아이템 제작권</option>
            <option value="profile">프로필 수정권</option>
          </select>
          <input
            id="itemSearch"
            type="search"
            maxlength="40"
            aria-label="이름·설명 검색"
            placeholder="이름·설명"
          />
          <button id="itemFind" type="button">검색</button></label
        >
        <!-- point_list.php, exp_list.php, order_list.php and
             inventory_list.php's search (sfl, stx). -->
        <form id="logSearch" hidden>
          <select id="logKind" aria-label="기록 종류">
            <option value="">전체 기록</option>
            <option value="money" data-name="moneyName">화폐</option>
            <option value="exp" data-name="expName">경험치</option>
            <option value="buy">구매기록</option>
          </select>
          <select id="logField" aria-label="검색 대상">
            <option value="nick">회원 닉네임</option>
            <option value="character">캐릭터 이름</option>
            <option value="item">아이템 이름</option>
            <option value="memo">내용</option>
          </select>
          <input
            id="logText"
            type="search"
            maxlength="40"
            aria-label="검색어"
          />
          <button type="submit">검색</button>
        </form>
        <!-- adm/member_list.php's 총회원수, 차단 and 탈퇴. -->
        <p id="memberCounts" hidden></p>
        <button id="adminNew" type="button">새로 등록</button>
        <div id="adminReport" hidden></div>
        <ul id="adminRows"></ul>
        <button id="adminMore" type="button" hidden>더 보기</button>
        <form id="titleGrantForm" class="card" hidden>
          <h2 id="titleGrantHeading">타이틀 지급·회수</h2>
          <label
            >처리<select id="titleGrantAction">
              <option value="grant">지급</option>
              <option value="revoke">회수</option>
            </select></label
          >
          <label
            ><input id="titleGrantAll" type="checkbox" />승인된 모든
            캐릭터</label
          >
          <label
            >대상 캐릭터 (여러 명 선택 가능)<select
              id="titleGrantCharacters"
              multiple
              size="8"
            ></select
          ></label>
          <p id="titleGrantStatus" role="status"></p>
          <button type="submit">선택한 대상에게 적용</button>
          <button id="titleGrantCancel" type="button">닫기</button>
        </form>
        <!-- adm/character_form.php: the owner's full edit of any character. -->
        <form id="characterForm" class="card" hidden>
          <h2 id="characterFormTitle"></h2>
          <div id="characterFields"></div>
          <p id="characterFormStatus" role="status"></p>
          <button type="submit">저장</button>
          <button id="characterCancel" type="button">취소</button>
        </form>
        <form id="adminForm" class="card" hidden>
          <h2 id="adminFormTitle"></h2>
          <div id="adminFields"></div>
          <p id="adminFormStatus" role="status"></p>
          <button type="submit">저장</button>
          <button id="adminCancel" type="button">취소</button>
        </form>
      </div>
    </main>
    <script type="module" src="../admin.js"></script>
  </body>
</html>
