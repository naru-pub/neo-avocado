<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>네오 아보카도</title>
    <meta
      name="description"
      content="아보카도 에디션을 나루로 옮긴 자캐 커뮤니티 템플릿."
    />
    <meta property="og:title" content="네오 아보카도" />
    <meta
      property="og:description"
      content="아보카도 에디션을 나루로 옮긴 자캐 커뮤니티 템플릿."
    />
    <meta property="og:image" content="og-image.png" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>네오 아보카도</h1>
      <p>
        <a href="https://github.com/tateck-develop/AvocadoEdition"
          >아보카도 에디션</a
        >을 나루로 옮긴 자캐 커뮤니티 템플릿.
      </p>
    </header>

    <main>
      <section class="shots">
        <picture>
          <source
            srcset="screenshots/home-dark.jpg"
            media="(prefers-color-scheme: dark)"
          />
          <img
            src="screenshots/home.jpg"
            width="1280"
            height="800"
            alt="메인 화면"
          />
        </picture>
        <picture>
          <source
            srcset="screenshots/members-dark.jpg"
            media="(prefers-color-scheme: dark)"
          />
          <img
            src="screenshots/members.jpg"
            width="1280"
            height="800"
            alt="멤버 목록"
          />
        </picture>
      </section>

      <section>
        <h2>기능</h2>
        <p>
          캐릭터 신청·승인, 로그 게시판, 주사위, 탐색·조합, 능력치·경험치,
          상점·인벤토리, 쪽지·호출, 운영 화면.
        </p>
      </section>

      <section>
        <h2>설치</h2>
        <ol>
          <li>
            <a href="https://naru.pub/signup">나루</a> 가입,
            <a href="https://naru.pub/supporter">서포터 플랜</a>.
          </li>
          <li>
            <a
              href="https://naru.pub/board/01a17ce0-b5ad-7981-84c1-d59d8b2e20c5"
              >나루 게시판</a
            >의 네오 아보카도 템플릿을 사이트 맨 위(/)에 적용.
          </li>
          <li><code>/admin/</code>에서 운영자 로그인, 게시판 만들기.</li>
        </ol>
        <p>회원은 나루 계정만 있으면 됩니다.</p>
      </section>
    </main>

    <footer>
      <a href="https://github.com/naru-pub/neo-avocado">GitHub</a> ·
      <a href="https://naru.pub">나루</a> · GPL-3.0
    </footer>
  </body>
</html>
