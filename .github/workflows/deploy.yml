name: Deploy to Naru

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the site name
        env:
          NARU_SITE: ${{ vars.NARU_SITE }}
        run: |
          if [ -z "$NARU_SITE" ]; then
            echo "::error::Set the NARU_SITE repository variable to the Naru login name."
            exit 1
          fi
      # 페이지와 서버 함수만 올린다. 나루가 _naru/functions/<모듈>.js를
      # 서버에서 돌린다.
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html app.js style.css config.js _site/
          cp -R _naru _site/_naru
      - uses: naru-pub/actions/deploy@v1
        with:
          site: ${{ vars.NARU_SITE }}
          dir: _site
          target: /
