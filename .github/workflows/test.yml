name: Test

# The sources are TypeScript; Naru publishes their build. Every push is
# type-checked and tested; a push to main also builds the site and deploys
# it to Naru through its GitHub Actions deploy (scripts/deploy-naru.mjs).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run vendor:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Naru's GitHub CI deploy checks this run's OIDC token against the
      # site's GitHub Actions target (naru-pub/neo-avocado, refs/heads/main).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/deploy-naru.mjs dist neo-avocado
