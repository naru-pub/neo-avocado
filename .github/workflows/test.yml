name: Test

# The sources are TypeScript; Naru publishes their build. Every push is
# type-checked and tested; a push to main also builds the site, publishes it
# as the template's next version, and deploys landing/ to the Naru site
# neo-avocado through its GitHub Actions deploy (scripts/deploy-naru.mjs).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run vendor:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Naru's GitHub CI deploy checks this run's OIDC token against the
      # site's GitHub Actions target (naru-pub/neo-avocado, refs/heads/main).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # The community (dist/) is the 네오 아보카도 template's next version,
      # offered to every site that installed it: the template whose GitHub
      # source on its post is naru-pub/neo-avocado, main, dist, posted by the
      # Naru account neo-avocado. Until that post exists, this step does
      # nothing.
      - uses: naru-pub/actions/deploy@v1
        with:
          dir: dist
          template-owner: neo-avocado
          # Naru's own preview would be the entrance page: the template's
          # files alone have no community to show (scripts/screenshots.mjs).
          preview: docs/template-preview.jpg
      # neo-avocado.naru.pub itself is the landing page and installation
      # guide. It keeps the community's migrations, which the site has
      # applied and so cannot drop, and with them its tables; no routes,
      # queries or mutations, so nothing of the community is served.
      - run: |
          mkdir -p "$RUNNER_TEMP/landing/_naru"
          cp -R landing/. "$RUNNER_TEMP/landing/"
          cp -R dist/_naru/migrations "$RUNNER_TEMP/landing/_naru/"
      - run: node scripts/deploy-naru.mjs "$RUNNER_TEMP/landing" neo-avocado
